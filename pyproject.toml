[project]
name = "coasti-superset-io"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = []
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.5",
    "typer>=0.21.1",
    "ruamel.yaml>=0.18.10",
    "python-dotenv>=1.2.1",
    "prompt-toolkit>=3.0.52",
]


[project.scripts]
superset-io = "superset_io:cli.app"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typed" },
    { include-group = "test" },
    "pre-commit>=4.5.1",
]

lint = ["ruff>=0.14.13"]
test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]
typed = ["mypy>=1.19.1", "types-requests>=2.32.4.20260107"]

[tool.ruff]
target-version = "py311"
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "docs/**/*"]

[tool.ruff.format]
exclude = ["*.md", "docs/**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "PTH", # Use pathlib instead of os.path
    "W",   # pycodestyle
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_decorators = true
allow_redefinition = true

[[tool.mypy.overrides]]
# If tests/ is a package => tests.*
# If tests are discovered as top-level modules => test_*
module = ["tests.*"]
disable_error_code = ["method-assign", "attr-defined"]


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--cov=."]
filterwarnings = ["error", "ignore::DeprecationWarning"]
pythonpath = ["."]

[tool.coverage.report]
#omit = ["*/tests/*"]
exclude_lines = ["if TYPE_CHECKING"]
exclude_also = ["raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/superset_io"]
